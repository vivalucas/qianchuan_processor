name: Build and Release qianchuan_processor

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          pip install pyinstaller ffmpeg-python
      - name: Download FFmpeg for Windows
        run: |
          curl -L https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -o ffmpeg.zip
          7z x ffmpeg.zip -o_temp -y
          $binDir = Get-ChildItem _temp -Recurse -Include "bin" -Directory | Where-Object { Test-Path "$_\ffmpeg.exe" } | Select-Object -First 1
          if (-not $binDir) { throw "❌ 未找到 bin 目录或 ffmpeg.exe" }
          mkdir ffmpeg
          copy "$($binDir.FullName)\ffmpeg.exe" ffmpeg\
          copy "$($binDir.FullName)\ffprobe.exe" ffmpeg\
      - name: Build executable
        run: |
          pyinstaller --onefile --windowed `
            --name qianchuan_processor_${{ github.ref_name }} `
            --icon assets/app.ico `
            --add-data "ffmpeg;ffmpeg" `
            --hidden-import=ffmpeg `
            --hidden-import=tkinter `
            --optimize 2 `
            --exclude-module=pip `
            --exclude-module=setuptools `
            --exclude-module=distutils `
            main.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qianchuan_processor-windows-${{ github.ref_name }}
          path: dist/qianchuan_processor_${{ github.ref_name }}.exe

  build-macos-arm64:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller ffmpeg-python
      - name: Download static FFmpeg for macOS arm64
        run: |
          npm install --no-save --no-package-lock ffmpeg-static ffprobe-static
          mkdir -p ffmpeg
          cp "$(node -p "require('ffmpeg-static')")" ffmpeg/ffmpeg
          cp "$(node -p "require('ffprobe-static').path")" ffmpeg/ffprobe
          chmod +x ffmpeg/ffmpeg ffmpeg/ffprobe
          file ffmpeg/ffmpeg
          file ffmpeg/ffprobe
      - name: Build macOS arm64 app bundle
        run: |
          pyinstaller --onedir --windowed \
            --name "千川处理器" \
            --icon assets/app.icns \
            --add-data "ffmpeg:ffmpeg" \
            --hidden-import=ffmpeg \
            --hidden-import=tkinter \
            --optimize 2 \
            --exclude-module=pip \
            --exclude-module=setuptools \
            --exclude-module=distutils \
            main.py
      - name: Create DMG
        run: |
          mkdir -p dmg_root
          cp -R "dist/千川处理器.app" dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "千川处理器" \
            -srcfolder dmg_root \
            -ov -format UDZO \
            "dist/qianchuan_processor_${{ github.ref_name }}_macos_arm64.dmg"
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: qianchuan_processor-macos-arm64-${{ github.ref_name }}
          path: dist/qianchuan_processor_${{ github.ref_name }}_macos_arm64.dmg

  release:
    needs: [build-windows, build-macos-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: qianchuan_processor-windows-${{ github.ref_name }}
          path: dist/

      - name: Download macOS arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: qianchuan_processor-macos-arm64-${{ github.ref_name }}
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/qianchuan_processor_${{ github.ref_name }}.exe
            dist/qianchuan_processor_${{ github.ref_name }}_macos_arm64.dmg
          generate_release_notes: true
